name: Preços do Tesouro

# Robozinho da aba Investimentos: 2x por dia pega os preços do Tesouro Direto
# e atualiza dados/tesouro.json (o app lê esse arquivinho). Só dados públicos.
on:
  schedule:
    - cron: "17 11 * * *"   # 8h17 em Brasília
    - cron: "47 22 * * *"   # 19h47 em Brasília
  workflow_dispatch:

permissions:
  contents: write

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 ferramentas/tesouro.py
      - name: Guardar se mudou
        run: |
          if git diff --quiet dados/tesouro.json; then
            echo "Preços iguais aos de antes."
            exit 0
          fi
          git config user.name "robo-tesouro"
          git config user.email "robo-tesouro@users.noreply.github.com"
          git add dados/tesouro.json
          git commit -m "Preços do Tesouro atualizados"
          git push
